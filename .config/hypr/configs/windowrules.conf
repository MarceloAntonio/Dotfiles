windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

layerrule {
    name = blur-waybar
    match:namespace = ^waybar$
    blur = on
    ignore_alpha = 0.02
}

layerrule {
    name = blur-swaync-cc
    match:namespace = ^swaync-control-center$
    blur = on
    ignore_alpha = 0.1
}

layerrule {
    name = blur-swaync-notif
    match:namespace = ^swaync-notification-window$
    blur = on
    ignore_alpha = 0.1
}

layerrule {
    name = blur-rofi
    match:namespace = ^rofi$
    blur = on
    ignore_alpha = 0.1
}