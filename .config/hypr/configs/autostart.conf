exec-once = waybar &
exec-once = nm-applet --indicator &
exec-once = awww-daemon
exec-once = sleep 1 && awww img "$(cat $HOME/.config/hypr/.current_wallpaper 2>/dev/null || echo $HOME/Pictures/Wallpaper/wallpaper_16.png)"
