background {
    monitor =
    path = /home/celo/.config/hypr/hyprlock/wallpaper
    blur_passes = 0
    blur_size = 0
    brightness = 0.9
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 0
    dots_size = 0.33
    dots_space = 0.5
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(19, 19, 19, 0.55)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    placeholder_text = 
    hide_input = false
    rounding = 16
    check_color = rgba(255, 255, 255, 0.3)
    fail_color = rgba(255, 97, 97, 0.5)
    fail_transition = 300
    position = 0, -20
    halign = center
    valign = center
}

# --- SHUTDOWN ---
shape {
    monitor =
    size = 50, 50
    color = rgba(19, 19, 19, 0.55)
    rounding = 16
    border_size = 0
    border_color = rgba(255, 255, 255, 0)
    position = -90, 50
    halign = center
    valign = bottom
    on-click = systemctl poweroff
}
label {
    monitor =
    text =  󰤆 
    color = rgb(255, 255, 255)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = -92, 59
    halign = center
    valign = bottom
    on-click = systemctl poweroff
}

# --- REBOOT ---
shape {
    monitor =
