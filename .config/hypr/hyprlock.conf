# --- LOGOUT ---
shape {
    monitor =
    size = 50, 50
    color = rgba(19, 19, 19, 0.55)
    rounding = 16
    border_size = 0
    border_color = rgba(255, 255, 255, 0)
    position = 90, 50
    halign = center
    valign = bottom
    on-click = hyprctl dispatch exit
}
label {
    monitor =
    text =  󰗼 
    color = rgb(255, 255, 255)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 88, 59
    halign = center
    valign = bottom
    on-click = hyprctl dispatch exit
}

label {
    text = cmd[update:1000] echo "$TIME"
    color = rgb(FFFFFF)
    font_size = 100
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B' | sed 's/^./\U&/')"
    color = rgba(255, 255, 255, 0.75)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}
