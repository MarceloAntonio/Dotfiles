font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
enable_audio_bell no
font_size 11.0
window_padding_width 25
cursor_trail 1
include current-theme.conf
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
background_opacity          0.8
mouse_map right press ungrabbed paste_from_clipboard

# Barra de rolagem: aparece ao passar o mouse na borda direita (clique/arraste para navegar)
scrollbar                   hovered
scrollbar_interactive       yes
scrollbar_jump_on_click     yes
scrollbar_width             0.25
scrollbar_hover_width       0.35
scrollbar_radius            1
scrollbar_gap               0.15
scrollbar_track_opacity     0
scrollbar_track_hover_opacity 0
scrollbar_handle_opacity    0.4
