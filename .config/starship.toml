# ╔══════════════════════════════════════════════════════════════╗
# ║        L I Q U I D   G L A S S   —   S T A R S H I P        ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Tema Starship baseado na estética Liquid Glass (Monocromático, Minimalista, Translúcido)
# Desenvolvido para complementar a Waybar, Rofi e SwayNC.

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
[╭─](bold bright-black) $os$directory$git_branch$git_status$c$rust$golang$nodejs$php$java$kotlin$haskell$python$docker_context$fill$cmd_duration$time
[╰─](bold bright-black)$character"""

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold white)"
error_symbol = "[❯](bold blue)"
vicmd_symbol = "[❮](bold white)"

[os]
disabled = false
style = "bold white"
format = "[$symbol]($style) "

[os.symbols]
Arch = "󰣇"
Debian = ""
Ubuntu = "󰕈"
Macos = "󰀵"
Windows = "󰍲"
Fedora = ""
Linux = "󰌽"

[directory]
style = "bold white"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "bold bright-black"
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = ""
style = "bold blue"
format = "[$symbol $branch]($style) "

[git_status]
style = "bold blue"
format = "([$all_status$ahead_behind]($style)) "

[c]
symbol = ""
style = "bold blue"
format = "[$symbol $version]($style) "

[rust]
symbol = ""
style = "bold blue"
format = "[$symbol $version]($style) "

[golang]
symbol = ""
style = "bold blue"
format = "[$symbol $version]($style) "

[nodejs]
symbol = ""
style = "bold blue"
format = "[$symbol $version]($style) "

[php]
symbol = ""
style = "bold blue"
format = "[$symbol $version]($style) "

[java]
symbol = ""
style = "bold blue"
format = "[$symbol $version]($style) "

[kotlin]
symbol = ""
style = "bold blue"
format = "[$symbol $version]($style) "

[haskell]
symbol = ""
style = "bold blue"
format = "[$symbol $version]($style) "

[python]
symbol = ""
style = "bold blue"
format = "[$symbol $version]($style) "

[docker_context]
symbol = ""
style = "bold blue"
format = "[$symbol $context]($style) "

[cmd_duration]
style = "bold bright-black"
format = "[󱎫 $duration]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "bold blue"
format = "[ $time]($style)"
