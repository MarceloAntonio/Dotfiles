<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Firefox keeps Inter Display -->
  <match target="pattern">
    <test name="prgname" compare="eq"><string>firefox</string></test>
    <test name="family" compare="eq"><string>SF Pro Display</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter Display</string></edit>
  </match>
</fontconfig>
